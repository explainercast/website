<figure class="audio-player">
  <audio src="{{ include.playback_url }}?website_player=true" preload="none" controls>
    Your browser doesn't support the <code>audio</code> element.
  </audio>

  <div class="ap">
    <button class="ap__play" type="button" aria-label="Play episode">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10.2-6.8a1 1 0 0 0 0-1.7L9.53 4.35A1 1 0 0 0 8 5.2z"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6.5" y="5" width="4" height="14" rx="1.4"/>
        <rect x="13.5" y="5" width="4" height="14" rx="1.4"/>
      </svg>
    </button>

    <div class="ap__body">
      <div class="ap__scrub" role="slider" tabindex="0"
           aria-label="Seek within episode" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ap__track">
          <div class="ap__buffer"></div>
          <div class="ap__fill"></div>
        </div>
        <span class="ap__knob"></span>
      </div>

      <div class="ap__row">
        <span><span class="ap__current">0:00</span> / <span class="ap__duration">{{ include.duration | default: '--:--' }}</span></span>

        <span class="ap__bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>

        <a class="ap__dl" href="{{ include.playback_url }}?website_download=true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/>
            <path d="M4 20h16"/>
          </svg>
          Download
        </a>
      </div>
    </div>
  </div>
</figure>
